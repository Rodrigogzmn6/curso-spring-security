spring:
  application:
    name: spring-security
  security:
    user:
      name: ${USER}
      password: ${PASS}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    private:
      key: ${JWT_PRIVATE_KEY}
    user:
      generator: ${JWT_USER_GENERATOR}