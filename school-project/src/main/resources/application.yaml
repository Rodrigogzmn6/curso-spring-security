spring:
  application:
    name: school-project
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: ${ADMIN_USER}
      password: ${ADMIN_PASSWORD}
# JWT Config
security:
  jwt:
    private:
      key: ${JWT_PRIVATE_KEY}
    user:
      generator: ${JWT_USER_GENERATOR}